let currentDate = new Date(2026, 10, 1);
let miniCalendarDate = new Date(2026, 10, 1);

async function loadMeetingsFromServer() {
    try {
        const response = await fetch("/api/meetings", {
            cache: "no-store",
            headers: { "Accept": "application/json" }
        });
        if (!response.ok) throw new Error("Unable to load meetings from server.");

        const data = await response.json();
        if (!Array.isArray(data)) throw new Error("meetings.json must contain a JSON array.");

        contacts = data;

        renderCalendar();
        renderUserList();
        renderMiniCalendar();
        showStatus(`Automatically loaded ${contacts.length} contacts from meetings.json.`, "success");
    } catch (error) {
        showStatus("Auto import failed: " + error.message, "error");
    }
}

function validDate(dateString) {
    if (typeof dateString !== "string" ||
        !/^\d{4}-\d{2}-\d{2}$/.test(dateString)) {
        return false;
    }

    const [year, month, day] = dateString.split("-").map(Number);

    const date = new Date(Date.UTC(year, month - 1, day));

    return date.getUTCFullYear() === year &&
           date.getUTCMonth() === month - 1 &&
           date.getUTCDate() === day;
}

function validTime(time) {
    return typeof time === "string" &&
           /^([01]\d|2[0-3]):[0-5]\d$/.test(time);
}

function getScheduledEvents() {
    return contacts.filter(person =>
        validDate(person.date) &&
        validTime(person.time)
    );
}

function renderUserList() {
    const list = document.getElementById("userList");
    list.replaceChildren();

    if (contacts.length === 0) {
        const empty = document.createElement("p");
        empty.className = "empty";
        empty.textContent = "No users found";
        list.appendChild(empty);
        return;
    }

    contacts.forEach(person => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "user-item";

        const name = document.createElement("span");
        name.className = "user-item-name";
        name.textContent = person.name || "Unnamed user";

        const email = document.createElement("span");
        email.className = "user-item-email";
        email.textContent = person.email || "No email";

        const status = document.createElement("span");
        status.className = "user-status";
        const isScheduled = validDate(person.date) && validTime(person.time);
        status.textContent = isScheduled
            ? `${person.date} · ${formatTime(person.time)}`
            : "Unscheduled";
        if (!isScheduled) status.classList.add("unscheduled");

        button.append(name, email, status);
        button.onclick = () => {
            if (isScheduled) {
                showDetails(person);
            } else {
                openScheduleForm(person);
            }
        };

        list.appendChild(button);
    });
}

    const month = currentDate.getMonth();

    document.getElementById("monthTitle").textContent =
        currentDate.toLocaleDateString("en-US", {
            month: "long",
            year: "numeric"
        });

    const weekdays = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

    weekdays.forEach(day => {
        const element = document.createElement("div");
        element.className = "weekday";
        element.textContent = day;
        calendar.appendChild(element);
    });

    const firstDay = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();

    const previousMonthDays = new Date(year, month, 0).getDate();

    const today = new Date();

    for (let i = 0; i < 42; i++) {
        let dayNumber;
        let cellDate;
        let otherMonth = false;

        if (i < firstDay) {
            dayNumber = previousMonthDays - firstDay + i + 1;
            cellDate = new Date(year, month - 1, dayNumber);
            otherMonth = true;
        } else if (i >= firstDay + daysInMonth) {
            dayNumber = i - firstDay - daysInMonth + 1;
            cellDate = new Date(year, month + 1, dayNumber);
            otherMonth = true;
        } else {
            dayNumber = i - firstDay + 1;
            cellDate = new Date(year, month, dayNumber);
        }

        const dateKey =
            `${cellDate.getFullYear()}-${String(cellDate.getMonth()+1).padStart(2,"0")}-${String(cellDate.getDate()).padStart(2,"0")}`;

        const cell = document.createElement("div");
        cell.className = "day";

        if (otherMonth) cell.classList.add("other-month");

        if (
            cellDate.getFullYear() === today.getFullYear() &&
            cellDate.getMonth() === today.getMonth() &&
            cellDate.getDate() === today.getDate()
        ) {
            cell.classList.add("today");
        }

        const number = document.createElement("div");
        number.className = "day-number";
        number.textContent = dayNumber;
        cell.appendChild(number);

        const dayEvents = getScheduledEvents()
            .filter(event => event.date === dateKey)
            .sort((a, b) => a.time.localeCompare(b.time));

        dayEvents.forEach(event => {
            const eventElement = document.createElement("div");
            eventElement.className = "event";

            const time = document.createElement("div");
            time.className = "event-time";
            time.textContent = formatTime(event.time);

            const name = document.createElement("div");
            name.className = "event-name";
            name.textContent = event.name || "Unnamed event";

            eventElement.append(time, name);

            eventElement.onclick = () => showDetails(event);

            cell.appendChild(eventElement);
        });

        calendar.appendChild(cell);
    }

    renderSummary();
    renderUserList();
    renderMiniCalendar();
}

function changeMonth(amount) {
    currentDate.setMonth(currentDate.getMonth() + amount);
    miniCalendarDate = new Date(currentDate.getFullYear(), currentDate.getMonth(), 1);
    renderCalendar();
}

function goToday() {
    currentDate = new Date();
    currentDate.setDate(1);
    miniCalendarDate = new Date(currentDate.getFullYear(), currentDate.getMonth(), 1);
    renderCalendar();
}

function showDetails(event) {
    const body = document.getElementById("detailsBody");

    body.replaceChildren();

    const heading = document.createElement("h2");
    heading.textContent = event.name || "Meeting";
    body.appendChild(heading);

    function addText(label, value) {
        if (value === undefined || value === null || value === "") return;

        const p = document.createElement("p");
        const strong = document.createElement("strong");
        strong.textContent = label + ": ";

        p.append(strong, document.createTextNode(String(value)));
        body.appendChild(p);
    }

    addText("Email", event.email);
    addText("Country", event.country);
    addText("Date", event.date);
    addText("Time", formatTime(event.time));
    addText("Timezone", event.timezone);
    addText("Phone", event.phone);
    addText("Meeting Password", event.meeting_password);

    ["linkedin", "github", "meeting_link"].forEach(key => {
        if (!event[key]) return;

        const p = document.createElement("p");
        const a = document.createElement("a");

        a.href = event[key];
        a.textContent = key === "meeting_link"
            ? "Join Meeting"
            : key.charAt(0).toUpperCase() + key.slice(1);

        a.target = "_blank";
        a.rel = "noopener noreferrer";

        p.appendChild(a);
        body.appendChild(p);
    });

    const actions = document.createElement("div");
    actions.className = "form-actions";

    const editButton = document.createElement("button");
    editButton.textContent = "Edit";
    editButton.onclick = () => openScheduleForm(event);

    const deleteButton = document.createElement("button");
    deleteButton.textContent = "Delete";
    deleteButton.className = "danger";
    deleteButton.onclick = () => deleteSchedule(event.id);

    actions.append(editButton, deleteButton);
    body.appendChild(actions);

    document.getElementById("details").style.display = "flex";
}

function hideDetails() {
    document.getElementById("details").style.display = "none";
}

function closeDetails(event) {
    if (event.target.id === "details") hideDetails();
}

function renderSummary() {
    const scheduled = getScheduledEvents();

    const summary = document.getElementById("summary");

    summary.innerHTML = `
        <p>Total contacts: <strong>${contacts.length}</strong></p>
        <p>Scheduled meetings: <strong>${scheduled.length}</strong></p>
        <p>Unscheduled contacts: <strong>${contacts.length - scheduled.length}</strong></p>
    `;
}

function showStatus(message, type) {
    const status = document.getElementById("status");
    if (!status) return;

    status.className = "status " + type;
    status.textContent = message;
}

function exportJSON() {
    const blob = new Blob(
        [JSON.stringify(contacts, null, 2)],
        { type: "application/json" }
    );

    const url = URL.createObjectURL(blob);

    const link = document.createElement("a");
    link.href = url;
    link.download = "interview-schedules.json";

    link.click();

    URL.revokeObjectURL(url);
}

async function openScheduleForm(meeting = null) {
    document.getElementById("scheduleModal").style.display = "flex";
    document.body.style.overflow = "hidden";
    document.getElementById("scheduleFormTitle").textContent = meeting ? "Edit Schedule" : "Create Schedule";

    document.getElementById("scheduleId").value = meeting?.id ?? "";
    document.getElementById("scheduleName").value = meeting?.name ?? "";
    document.getElementById("scheduleEmail").value = meeting?.email ?? "";
    document.getElementById("scheduleCountry").value = meeting?.country ?? "";
    document.getElementById("scheduleDate").value = meeting?.date ?? "";
    document.getElementById("scheduleTime").value = meeting?.time ?? "";
    document.getElementById("scheduleTimezone").value = meeting?.timezone ?? "";
    document.getElementById("schedulePhone").value = meeting?.phone ?? "";
    document.getElementById("scheduleLinkedin").value = meeting?.linkedin ?? "";
    document.getElementById("scheduleGithub").value = meeting?.github ?? "";
    document.getElementById("scheduleMeetingLink").value = meeting?.meeting_link ?? "";
    document.getElementById("scheduleMeetingPassword").value = meeting?.meeting_password ?? "";

    setTimeout(() => document.getElementById("scheduleName").focus(), 0);
}

function closeScheduleForm() {
    document.getElementById("scheduleModal").style.display = "none";
    document.body.style.overflow = "";
}

function closeScheduleModal(event) {
    if (event.target.id === "scheduleModal") closeScheduleForm();
}

async function saveSchedule() {
    const id = document.getElementById("scheduleId").value;
    const meeting = {
        name: document.getElementById("scheduleName").value.trim(),
        email: document.getElementById("scheduleEmail").value.trim() || null,
        country: document.getElementById("scheduleCountry").value.trim() || null,
        date: document.getElementById("scheduleDate").value || null,
        time: document.getElementById("scheduleTime").value || null,
        timezone: document.getElementById("scheduleTimezone").value.trim() || null,
        phone: document.getElementById("schedulePhone").value.trim() || null,
        linkedin: document.getElementById("scheduleLinkedin").value.trim() || null,
        github: document.getElementById("scheduleGithub").value.trim() || null,
        meeting_link: document.getElementById("scheduleMeetingLink").value.trim() || null,
        meeting_password: document.getElementById("scheduleMeetingPassword").value.trim() || null
    };

    if (!meeting.name) {
        showStatus("Name is required.", "error");
        return;
    }

    try {
        const response = await fetch(id ? `/api/meetings/${id}` : "/api/meetings", {
            method: id ? "PUT" : "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(meeting)
        });

        const result = await response.json();
        if (!response.ok) throw new Error(result.error || "Unable to save schedule.");

        closeScheduleForm();
        hideDetails();
        await loadMeetingsFromServer();
        showStatus(id ? "Schedule updated." : "Schedule created.", "success");
    } catch (error) {
        showStatus(error.message, "error");
    }
}

async function deleteSchedule(id) {
    if (!confirm("Delete this schedule?")) return;

    try {
        const response = await fetch(`/api/meetings/${id}`, { method: "DELETE" });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || "Unable to delete schedule.");

        hideDetails();
        await loadMeetingsFromServer();
        showStatus("Schedule deleted.", "success");
    } catch (error) {
        showStatus(error.message, "error");
    }
}

// Render immediately from the built-in data, then refresh from meetings.json.
renderCalendar();
renderUserList();
renderMiniCalendar();
loadMeetingsFromServer();

document.addEventListener("keydown", event => {
    if (event.key === "Escape") {
        closeScheduleForm();
        hideDetails();
    }
});

function changeMiniMonth(amount) {
    miniCalendarDate.setMonth(miniCalendarDate.getMonth() + amount);
    renderMiniCalendar();
}

function getDateKey(date) {
    return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
}

function isDateBooked(dateKey) {
    return getScheduledEvents().some(event => event.date === dateKey);
}

function selectFreeDate(dateKey) {
    currentDate = new Date(dateKey + "T00:00:00");
    currentDate.setDate(1);
    renderCalendar();

    openScheduleForm();
    document.getElementById("scheduleDate").value = dateKey;
}

function renderMiniCalendar() {
    const calendar = document.getElementById("miniCalendar");
    if (!calendar) return;

    calendar.innerHTML = "";

    const year = miniCalendarDate.getFullYear();
    const month = miniCalendarDate.getMonth();

    document.getElementById("miniMonthTitle").textContent =
        miniCalendarDate.toLocaleDateString("en-US", { month: "short", year: "numeric" });

    ["S", "M", "T", "W", "T", "F", "S"].forEach(day => {
        const weekday = document.createElement("div");
        weekday.className = "mini-weekday";
        weekday.textContent = day;
        calendar.appendChild(weekday);
    });

    const firstDay = new Date(year, month, 1);
    const gridStart = new Date(year, month, 1 - firstDay.getDay());
    const today = new Date();

    for (let i = 0; i < 42; i++) {
        const date = new Date(gridStart);
        date.setDate(gridStart.getDate() + i);

        const dateKey = getDateKey(date);
        const booked = isDateBooked(dateKey);

        const button = document.createElement("button");
        button.type = "button";
        button.className = `mini-day ${booked ? "booked" : "free"}`;
        button.textContent = date.getDate();

        if (date.getMonth() !== month) button.classList.add("other-month");
        if (getDateKey(today) === dateKey) button.classList.add("today");

        if (booked) {
            button.disabled = true;
            button.title = "This date already has meetings";
        } else {
            button.title = `Select free date ${dateKey}`;
            button.onclick = () => selectFreeDate(dateKey);
        }

        calendar.appendChild(button);
    }
}

function formatTime(time) {
    if (!validTime(time)) return "";

    const [hour, minute] = time.split(":").map(Number);
    const suffix = hour >= 12 ? "PM" : "AM";
    const formattedHour = hour % 12 || 12;

    return `${String(formattedHour).padStart(2, "0")}:${String(minute).padStart(2, "0")} ${suffix}`;
}
