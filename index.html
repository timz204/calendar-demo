<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interview Schedule Calendar</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f8fafd;
    color: #202124;
}

.app-layout {
    display: grid;
    grid-template-columns: 280px minmax(0, 1fr);
    min-height: calc(100vh - 70px);
}

.user-sidebar {
    background: white;
    border-right: 1px solid #dadce0;
    padding: 18px 14px;
    height: calc(100vh - 70px);
    position: sticky;
    top: 70px;
    overflow-y: auto;
}

.user-sidebar h3 {
    margin: 0 0 12px;
    padding: 0 4px;
}

.user-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.user-item {
    width: 100%;
    text-align: left;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #e4e7eb;
    background: #fff;
}

.user-item:hover {
    background: #f8fafd;
}

.user-item-name {
    display: block;
    font-weight: 600;
    color: #202124;
    overflow-wrap: anywhere;
}

.user-item-email {
    display: block;
    margin-top: 4px;
    color: #5f6368;
    font-size: 12px;
    overflow-wrap: anywhere;
}

.user-status {
    display: inline-block;
    margin-top: 7px;
    padding: 3px 7px;
    border-radius: 999px;
    background: #e8f0fe;
    color: #1967d2;
    font-size: 11px;
}

.user-status.unscheduled {
    background: #f1f3f4;
    color: #5f6368;
}

header {
    height: 70px;
    display: flex;
    align-items: center;
    padding: 0 25px;
    border-bottom: 1px solid #dadce0;
    background: white;
    gap: 20px;
    position: sticky;
    top: 0;
    z-index: 30;
}

.logo {
    font-size: 21px;
    font-weight: 600;
    color: #4285f4;
}

header button, button {
    cursor: pointer;
    border: 1px solid #dadce0;
    background: white;
    padding: 10px 16px;
    border-radius: 7px;
    font-size: 14px;
}

header button:hover, button:hover {
    background: #f1f3f4;
}

.month-title {
    font-size: 22px;
    font-weight: 500;
    min-width: 190px;
}

.container {
    padding: 22px;
    max-width: 1600px;
    margin: auto;
    width: 100%;
}

.toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
    flex-wrap: wrap;
}

.toolbar .spacer {
    flex: 1;
}

.primary {
    background: #1a73e8;
    color: white;
    border: none;
}

.primary:hover {
    background: #1765cc;
}

.calendar {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    border-top: 1px solid #dadce0;
    border-left: 1px solid #dadce0;
    background: white;
    width: 100%;
    overflow: hidden;
}

.weekday {
    text-align: center;
    padding: 14px 5px;
    font-size: 12px;
    font-weight: 600;
    color: #5f6368;
    border-right: 1px solid #dadce0;
    border-bottom: 1px solid #dadce0;
}

.day {
    min-height: 125px;
    padding: 8px;
    border-right: 1px solid #dadce0;
    border-bottom: 1px solid #dadce0;
    position: relative;
    min-width: 0;
}

.day.other-month {
    background: #f8fafd;
    color: #a0a0a0;
}

.day.today {
    background: #f0f6ff;
}

.day-number {
    font-size: 13px;
    margin-bottom: 8px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 27px;
    height: 27px;
    border-radius: 50%;
}

.today .day-number {
    background: #1a73e8;
    color: white;
}

.event {
    background: #d2e3fc;
    border-left: 3px solid #4285f4;
    color: #174ea6;
    padding: 6px;
    margin-bottom: 5px;
    border-radius: 4px;
    font-size: 11px;
    cursor: pointer;
    overflow-wrap: anywhere;
}

.event:hover {
    background: #b8d3fa;
}

.event-time {
    font-weight: bold;
}

.event-name {
    margin-top: 3px;
}

.empty {
    text-align: center;
    padding: 60px 20px;
    color: #777;
}

.panel {
    background: white;
    border: 1px solid #dadce0;
    border-radius: 10px;
    padding: 20px;
    margin-top: 25px;
}

.panel h3 {
    margin-top: 0;
}

textarea,
input,
select {
    width: 100%;
    padding: 10px;
    border: 1px solid #dadce0;
    border-radius: 7px;
    font-family: inherit;
}

textarea {
    min-height: 180px;
}

.form-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
}

.form-grid label {
    display: block;
    font-size: 13px;
    font-weight: 600;
}

.form-grid label span {
    display: block;
    margin-bottom: 6px;
}

.form-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 16px;
}

.danger {
    color: #d93025;
    border-color: #d93025;
}

.status {
    margin-top: 12px;
    font-size: 13px;
}

.success {
    color: #188038;
}

.error {
    color: #d93025;
}

.warning {
    color: #b06000;
}

.details {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.4);
    z-index: 10;
    justify-content: center;
    align-items: center;
    padding: 15px;
}

.details-content {
    background: white;
    padding: 25px;
    border-radius: 12px;
    width: 100%;
    max-width: 450px;
    max-height: 85vh;
    overflow-y: auto;
}

.details-content h2 {
    margin-top: 0;
}

.details-content p {
    overflow-wrap: anywhere;
    font-size: 14px;
}

.details-content a {
    color: #1a73e8;
}

.close {
    float: right;
    border: none;
    font-size: 20px;
    padding: 0 8px;
}

.schedule-modal {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 20;
    background: rgba(32, 33, 36, .45);
    align-items: center;
    justify-content: center;
    padding: 15px;
}

.schedule-modal-content {
    width: 100%;
    max-width: 700px;
    max-height: 90vh;
    overflow-y: auto;
    margin: 0;
    background: white;
}

.schedule-modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
}

.schedule-modal-header h3 {
    margin: 0;
}

.mini-calendar-panel {
    border-bottom: 1px solid #e4e7eb;
    margin: 0 0 16px;
    padding: 0 2px 16px;
}

.mini-calendar-header {
    display: grid;
    grid-template-columns: 28px 1fr 28px;
    align-items: center;
    text-align: center;
    margin-bottom: 8px;
}

.mini-calendar-header button {
    width: 28px;
    height: 28px;
    padding: 0;
    border: none;
}

.mini-month-title {
    font-size: 13px;
    font-weight: 600;
}

.mini-calendar {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 2px;
}

.mini-weekday,
.mini-day {
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
}

.mini-weekday {
    color: #5f6368;
    font-weight: 600;
}

button.mini-day {
    width: 100%;
    padding: 0;
    border: 1px solid transparent;
    border-radius: 50%;
    background: transparent;
}

button.mini-day.free:hover {
    background: #e8f0fe;
    border-color: #4285f4;
}

button.mini-day.booked {
    background: #f1f3f4;
    color: #9aa0a6;
    cursor: not-allowed;
}

button.mini-day.today {
    border-color: #1a73e8;
    color: #1a73e8;
    font-weight: bold;
}

button.mini-day.other-month {
    color: #bdc1c6;
}

/* Layout fixes */
header {
    position: sticky;
    top: 0;
    z-index: 30;
}

.app-layout {
    width: 100%;
    grid-template-columns: 280px minmax(0, 1fr);
}

.user-sidebar {
    min-width: 280px;
}

.calendar-main,
.app-layout > .container {
    width: 100%;
    min-width: 0;
}

.container {
    max-width: none;
    width: 100%;
}

.calendar {
    width: 100%;
    overflow: hidden;
}

.day {
    min-width: 0;
}

.user-list .empty {
    padding: 20px 8px;
}

.schedule-modal-content {
    background: white;
}

/* Final visibility fixes */
.app-layout {
    display: grid !important;
    grid-template-columns: 300px minmax(600px, 1fr) !important;
    align-items: start;
    width: 100%;
}

.user-sidebar {
    display: block !important;
    visibility: visible !important;
    width: 300px !important;
    min-width: 300px !important;
    height: calc(100vh - 70px) !important;
    max-height: none !important;
    overflow-y: auto !important;
}

.app-layout > .container {
    display: block !important;
    width: 100% !important;
    min-width: 600px;
}

.calendar {
    display: grid !important;
    width: 100% !important;
}

.user-list {
    display: flex !important;
    visibility: visible !important;
}

@media(max-width: 900px) {
    .app-layout {
        grid-template-columns: 220px minmax(600px, 1fr) !important;
        overflow-x: auto;
    }

    .user-sidebar {
        width: 220px !important;
        min-width: 220px !important;
    }
}

@media(max-width: 700px) {
    .app-layout {
        display: block !important;
        overflow: visible;
    }

    .user-sidebar {
        width: 100% !important;
        min-width: 0 !important;
        height: auto !important;
    }

    .app-layout > .container {
        min-width: 0;
    }
}

.tabs {
    display: flex;
    gap: 6px;
    margin: 0 0 16px;
}

.tab-button {
    border-radius: 999px;
}

.tab-button.active {
    background: #1a73e8;
    color: white;
    border-color: #1a73e8;
}

.job-fields {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
}

.developer-fields {
    grid-column: 1 / -1;
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
}
</style>
</head>

<body>

<header>
    <div class="logo">▦ Calendar</div>
    <button onclick="goToday()">Today</button>
    <button onclick="changeMonth(-1)">‹</button>
    <button onclick="changeMonth(1)">›</button>
    <div class="month-title" id="monthTitle"></div>
</header>

<div class="app-layout">

    <div class="user-sidebar">
        <div class="mini-calendar-panel">
            <div class="mini-calendar-header">
                <button type="button" onclick="changeMiniMonth(-1)">‹</button>
                <div class="mini-month-title" id="miniMonthTitle"></div>
                <button type="button" onclick="changeMiniMonth(1)">›</button>
            </div>
            <div class="mini-calendar" id="miniCalendar"></div>
        </div>

        <h3>Contacts</h3>
        <div class="user-list" id="userList"></div>
    </div>

    <div class="container">

        <div class="toolbar">
            <button onclick="goToday()">Today</button>
            <div class="spacer"></div>
            <button onclick="exportJSON()">Export JSON</button>
            <button class="primary" onclick="openScheduleForm()">New Schedule</button>
        </div>

        <div class="tabs" role="tablist" aria-label="Schedule type">
            <button type="button" class="tab-button active" id="jobInterviewTab" onclick="switchTab('interview')">Job Interview</button>
            <button type="button" class="tab-button" id="developerMeetingTab" onclick="switchTab('developer')">Developer Meeting</button>
        </div>

        <div class="calendar" id="calendar"></div>

        <div id="status" class="status"></div>

        <div class="panel">
            <h3>Schedule Summary</h3>
            <div id="summary"></div>
        </div>

    </div>

</div>

<div class="details" id="details" onclick="closeDetails(event)">
    <div class="details-content">
        <button class="close" onclick="hideDetails()">×</button>
        <div id="detailsBody"></div>
    </div>
</div>

<div class="schedule-modal" id="interviewModal" onclick="closeInterviewModal(event)">
    <div class="panel schedule-modal-content">
        <div class="schedule-modal-header">
            <h3 id="interviewFormTitle">Create Job Interview</h3>
            <button class="close" type="button" onclick="closeScheduleForm()">×</button>
        </div>
        <input type="hidden" id="interviewId">
        <div class="form-grid">
            <label><span>Candidate Name</span><input id="interviewName" required></label>
            <label><span>Recruiting Chat / Title</span><input id="interviewTitle"></label>
            <label><span>Email</span><input id="interviewEmail" type="email"></label>
            <label><span>Country</span><input id="interviewCountry"></label>
            <label><span>Date</span><input id="interviewDate" type="date"></label>
            <label><span>Start Time</span><input id="interviewTime" type="time"></label>
            <label><span>End Time</span><input id="interviewEndTime" type="time"></label>
            <label><span>Timezone</span>
                <select id="interviewTimezone">
                    <option value="">Select timezone</option>
                    <option value="America/New_York">EST / America/New_York</option>
                    <option value="America/Chicago">CST / America/Chicago</option>
                    <option value="America/Denver">MST / America/Denver</option>
                    <option value="America/Los_Angeles">PST / America/Los_Angeles</option>
                    <option value="America/Toronto">Toronto / America/Toronto</option>
                    <option value="Europe/London">GMT / Europe/London</option>
                    <option value="Europe/Berlin">Central Europe / Europe/Berlin</option>
                    <option value="Asia/Tokyo">Japan / Asia/Tokyo</option>
                    <option value="Asia/Kolkata">India / Asia/Kolkata</option>
                    <option value="Australia/Sydney">Sydney / Australia/Sydney</option>
                    <option value="UTC">UTC</option>
                </select>
            </label>
            <label><span>Phone</span><input id="interviewPhone"></label>
            <label><span>Job Description</span><input id="interviewJobDescription" type="url"></label>
            <label><span>Resume</span><input id="interviewResume" type="url"></label>
            <label><span>Meeting Link</span><input id="interviewMeetingLink" type="url"></label>
            <label><span>Interviewers</span><input id="interviewInterviewers"></label>
        </div>
        <div class="form-actions">
            <button type="button" onclick="closeScheduleForm()">Cancel</button>
            <button type="button" class="primary" onclick="saveInterview()">Save Interview</button>
        </div>
    </div>
</div>

<div class="schedule-modal" id="meetingModal" onclick="closeMeetingModal(event)">
    <div class="panel schedule-modal-content">
        <div class="schedule-modal-header">
            <h3 id="meetingFormTitle">Create Developer Meeting</h3>
            <button class="close" type="button" onclick="closeScheduleForm()">×</button>
        </div>
        <input type="hidden" id="meetingId">
        <div class="form-grid">
            <label><span>Name</span><input id="meetingName" required></label>
            <label><span>Email</span><input id="meetingEmail" type="email"></label>
            <label><span>Country</span><input id="meetingCountry"></label>
            <label><span>Date</span><input id="meetingDate" type="date"></label>
            <label><span>Start Time</span><input id="meetingTime" type="time"></label>
            <label><span>End Time</span><input id="meetingEndTime" type="time"></label>
            <label><span>Timezone</span>
                <select id="meetingTimezone">
                    <option value="">Select timezone</option>
                    <option value="America/New_York">EST / America/New_York</option>
                    <option value="America/Chicago">CST / America/Chicago</option>
                    <option value="America/Denver">MST / America/Denver</option>
                    <option value="America/Los_Angeles">PST / America/Los_Angeles</option>
                    <option value="America/Toronto">Toronto / America/Toronto</option>
                    <option value="Europe/London">GMT / Europe/London</option>
                    <option value="Europe/Berlin">Central Europe / Europe/Berlin</option>
                    <option value="Asia/Tokyo">Japan / Asia/Tokyo</option>
                    <option value="Asia/Kolkata">India / Asia/Kolkata</option>
                    <option value="Australia/Sydney">Sydney / Australia/Sydney</option>
                    <option value="UTC">UTC</option>
                </select>
            </label>
            <label><span>Phone</span><input id="meetingPhone"></label>
            <label><span>LinkedIn</span><input id="meetingLinkedin" type="url"></label>
            <label><span>GitHub</span><input id="meetingGithub" type="url"></label>
            <label><span>Meeting Link</span><input id="meetingLink" type="url"></label>
            <label><span>Meeting Password</span><input id="meetingPassword"></label>
        </div>
        <div class="form-actions">
            <button type="button" onclick="closeScheduleForm()">Cancel</button>
            <button type="button" class="primary" onclick="saveDeveloperMeeting()">Save Meeting</button>
        </div>
    </div>
</div>

async function loadMeetingsFromServer() {
    try {
        const [meetingResponse, interviewResponse] = await Promise.all([
            fetch("/api/meetings", { cache: "no-store", headers: { "Accept": "application/json" } }),
            fetch("/api/interviews", { cache: "no-store", headers: { "Accept": "application/json" } })
        ]);

        if (!meetingResponse.ok) throw new Error("Unable to load meetings.json.");
        if (!interviewResponse.ok) throw new Error("Unable to load interview.json.");

        developerMeetings = await meetingResponse.json();
        jobInterviews = await interviewResponse.json();

        if (!Array.isArray(developerMeetings) || !Array.isArray(jobInterviews)) {
            throw new Error("Both schedule files must contain JSON arrays.");
        }

        contacts = activeTab === "interview" ? jobInterviews : developerMeetings;

        renderCalendar();
        renderUserList();
        renderMiniCalendar();
        showStatus(`Loaded ${jobInterviews.length} interviews and ${developerMeetings.length} developer meetings.`, "success");
    } catch (error) {
        showStatus("Auto import failed: " + error.message, "error");
    }
}

function validDate(dateString) {
    if (typeof dateString !== "string" ||
        !/^\d{4}-\d{2}-\d{2}$/.test(dateString)) {
        return false;
    }

    const [year, month, day] = dateString.split("-").map(Number);

    const date = new Date(Date.UTC(year, month - 1, day));

    return date.getUTCFullYear() === year &&
           date.getUTCMonth() === month - 1 &&
           date.getUTCDate() === day;
}

function validTime(time) {
    return typeof time === "string" &&
           /^([01]\d|2[0-3]):[0-5]\d$/.test(time);
}

function getScheduledEvents() {
    return contacts.filter(person =>
        validDate(person.date) &&
        validTime(person.time)

function renderCalendar() {
    const calendar = document.getElementById("calendar");

    calendar.innerHTML = "";

    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();

    document.getElementById("monthTitle").textContent =
        currentDate.toLocaleDateString("en-US", {
            month: "long",
            year: "numeric"
        });

    const weekdays = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

    weekdays.forEach(day => {
        const element = document.createElement("div");
        element.className = "weekday";
        element.textContent = day;
        calendar.appendChild(element);
    });

    const firstDay = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();

    const previousMonthDays = new Date(year, month, 0).getDate();

    const today = new Date();

    for (let i = 0; i < 42; i++) {
        let dayNumber;
        let cellDate;
        let otherMonth = false;

        if (i < firstDay) {
            dayNumber = previousMonthDays - firstDay + i + 1;
            cellDate = new Date(year, month - 1, dayNumber);
            otherMonth = true;
        } else if (i >= firstDay + daysInMonth) {
            dayNumber = i - firstDay - daysInMonth + 1;
            cellDate = new Date(year, month + 1, dayNumber);
            otherMonth = true;
        } else {
            dayNumber = i - firstDay + 1;
            cellDate = new Date(year, month, dayNumber);
        }

        const dateKey =
            `${cellDate.getFullYear()}-${String(cellDate.getMonth()+1).padStart(2,"0")}-${String(cellDate.getDate()).padStart(2,"0")}`;

        const cell = document.createElement("div");
        cell.className = "day";

        if (otherMonth) cell.classList.add("other-month");

        if (
            cellDate.getFullYear() === today.getFullYear() &&
            cellDate.getMonth() === today.getMonth() &&
            cellDate.getDate() === today.getDate()
        ) {
            cell.classList.add("today");
        }

        const number = document.createElement("div");
        number.className = "day-number";
        number.textContent = dayNumber;
        cell.appendChild(number);

        const dayEvents = getScheduledEvents()
            .filter(event => event.date === dateKey)
            .sort((a, b) => a.time.localeCompare(b.time));

        dayEvents.forEach(event => {
            const eventElement = document.createElement("div");
            eventElement.className = "event";

            const time = document.createElement("div");
            time.className = "event-time";
            time.textContent = formatTimeRange(event.time, event.end_time);

            const name = document.createElement("div");
            name.className = "event-name";
            name.textContent = event.name || "Unnamed event";

            eventElement.append(time, name);

            eventElement.onclick = () => showDetails(event);

            cell.appendChild(eventElement);
        });

        calendar.appendChild(cell);
    }

    renderSummary();
    renderUserList();
    renderMiniCalendar();
}

        strong.textContent = label + ": ";

        p.append(strong, document.createTextNode(String(value)));
        body.appendChild(p);
    }

    addText("Email", event.email);
    addText("Country", event.country);
    addText("Date", event.date);
    addText("Time", formatTimeRange(event.time, event.end_time));
    addText("Timezone", event.timezone);
    addText("Phone", event.phone);
    addText("Meeting Password", event.meeting_password);
    addText("Recruiting Chat / Title", event.title);
    addText("Interviewers", event.interviewers);

        a.href = event[key];

        a.rel = "noopener noreferrer";

        p.appendChild(a);

    actions.append(editButton, deleteButton);

    document.getElementById("details").style.display = "flex";

async function saveScheduleItem(collection, id, item) {
    if (!item.name) {
        showStatus("Name is required.", "error");
        return;
    }

    if (item.time && item.end_time && item.end_time <= item.time) {
        showStatus("End time must be after start time.", "error");
        return;
    }

    try {
        const response = await fetch(id ? `/api/${collection}/${id}` : `/api/${collection}`, {
            method: id ? "PUT" : "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(item)
        });

        const result = await response.json();
        if (!response.ok) throw new Error(result.error || "Unable to save schedule.");

        closeScheduleForm();
        hideDetails();
        await loadMeetingsFromServer();
        showStatus(id ? "Schedule updated." : "Schedule created.", "success");
    } catch (error) {
        showStatus(error.message, "error");
    }
}

async function deleteSchedule(id) {
    if (!confirm("Delete this schedule?")) return;

    try {
        const collection = activeTab === "interview" ? "interviews" : "meetings";
        const response = await fetch(`/api/${collection}/${id}`, { method: "DELETE" });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || "Unable to delete schedule.");

        hideDetails();
        await loadMeetingsFromServer();
        showStatus("Schedule deleted.", "success");
    } catch (error) {
        showStatus(error.message, "error");
    }
}

function getDateKey(date) {
    return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
}

function isDateBooked(dateKey) {
    return getScheduledEvents().some(event => event.date === dateKey);
}

function selectFreeDate(dateKey) {
    currentDate = new Date(dateKey + "T00:00:00");
    currentDate.setDate(1);
    renderCalendar();

    openScheduleForm();
    document.getElementById("scheduleDate").value = dateKey;

function renderMiniCalendar() {
    const calendar = document.getElementById("miniCalendar");
    if (!calendar) return;

    calendar.innerHTML = "";

    const year = miniCalendarDate.getFullYear();
    const month = miniCalendarDate.getMonth();

    document.getElementById("miniMonthTitle").textContent =
        miniCalendarDate.toLocaleDateString("en-US", { month: "short", year: "numeric" });

    ["S", "M", "T", "W", "T", "F", "S"].forEach(day => {
        const weekday = document.createElement("div");
        weekday.className = "mini-weekday";
        weekday.textContent = day;
        calendar.appendChild(weekday);
    });

    const firstDay = new Date(year, month, 1);
    const gridStart = new Date(year, month, 1 - firstDay.getDay());
    const today = new Date();

    for (let i = 0; i < 42; i++) {
        const date = new Date(gridStart);
        date.setDate(gridStart.getDate() + i);

        const dateKey = getDateKey(date);
        const booked = isDateBooked(dateKey);

        const button = document.createElement("button");
        button.type = "button";
        button.className = `mini-day ${booked ? "booked" : "free"}`;
        button.textContent = date.getDate();

        if (date.getMonth() !== month) button.classList.add("other-month");
        if (getDateKey(today) === dateKey) button.classList.add("today");

        if (booked) {
            button.disabled = true;
            button.title = "This date already has meetings";
        } else {
            button.title = `Select free date ${dateKey}`;
            button.onclick = () => selectFreeDate(dateKey);
        }

        calendar.appendChild(button);
    }
}

function formatTime(time) {
    if (!validTime(time)) return "";

    const [hour, minute] = time.split(":").map(Number);
    const suffix = hour >= 12 ? "PM" : "AM";
    const formattedHour = hour % 12 || 12;

    return `${String(formattedHour).padStart(2, "0")}:${String(minute).padStart(2, "0")} ${suffix}`;
}

function formatTimeRange(start, end) {
    if (!validTime(start)) return "";
    if (!validTime(end)) return formatTime(start);

    const [startHour, startMinute] = start.split(":").map(Number);
    const [endHour, endMinute] = end.split(":").map(Number);

    const startSuffix = startHour >= 12 ? "PM" : "AM";
    const endSuffix = endHour >= 12 ? "PM" : "AM";

    const formattedStartHour = startHour % 12 || 12;
    const formattedEndHour = endHour % 12 || 12;

    return `${String(formattedStartHour).padStart(2, "0")}:${String(startMinute).padStart(2, "0")} ${startSuffix} - ${String(formattedEndHour).padStart(2, "0")}:${String(endMinute).padStart(2, "0")} ${endSuffix}`;
}

function showTab(tab) {
